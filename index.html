
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBWAY RUNNER - Solomon Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{background:linear-gradient(#87CEEB,#1E90FF);overflow:hidden;font-family:Arial;font-weight:bold;}
#game{position:relative;width:100vw;height:100vh;max-width:400px;margin:0 auto;overflow:hidden;background:linear-gradient(#87CEEB 0%, #87CEEB 40%, #555 40%, #333 100%);}
.lane{position:absolute;bottom:0;width:33.33%;height:100%;border-right:1px dashed rgba(255,255,255,0.2);}
#player{position:absolute;width:50px;height:70px;background:#FFD700;border:3px solid #000;border-radius:15px 15px 5px 5px;bottom:80px;left:50%;transform:translateX(-50%);transition:left 0.15s, bottom 0.2s;z-index:10;}
#player::before{content:'🏃';font-size:35px;position:absolute;top:5px;left:5px;}
.obstacle{position:absolute;width:50px;height:50px;background:#FF0000;border:2px solid #000;border-radius:5px;z-index:5;}
.obstacle.train{background:#444;width:60px;height:60px;}
.obstacle.train::after{content:'🚃';font-size:40px;position:absolute;top:0;left:5px;}
.coin{position:absolute;width:30px;height:30px;background:gold;border-radius:50%;border:2px solid #FFA500;z-index:5;animation:spin 0.5s linear infinite;}
.coin::after{content:'🪙';font-size:20px;position:absolute;top:0;left:2px;}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
#ui{position:absolute;top:0;left:0;right:0;padding:15px;display:flex;justify-content:space-between;color:#fff;text-shadow:2px 2px 0 #000;font-size:18px;z-index:20;}
#controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:15px;z-index:20;}
.btn{width:70px;height:70px;background:rgba(0,255,136,0.8);border:3px solid #000;border-radius:15px;font-size:30px;display:flex;align-items:center;justify-content:center;}
#startScreen{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#00ff88;z-index:100;}
#startScreen h1{font-size:36px;margin-bottom:10px;text-shadow:0 0 10px #00ff88;}
#startScreen button{padding:15px 40px;font-size:20px;background:#00ff88;color:#000;border:none;border-radius:30px;font-weight:bold;margin-top:20px;}
</style>
</head>
<body>
<div id="game">
<div class="lane" style="left:0"></div>
<div class="lane" style="left:33.33%"></div>
<div class="lane" style="left:66.66%"></div>

<div id="ui">
<div>🪙 <span id="coins">0</span></div>
<div>🏃 <span id="score">0</span>m</div>
</div>

<div id="player"></div>

<div id="controls">
<div class="btn" onclick="moveLeft()">⬅️</div>
<div class="btn" onclick="jump()">⬆️</div>
<div class="btn" onclick="moveRight()">➡️</div>
</div>

<div id="startScreen">
<h1>🏃 SUBWAY RUNNER</h1>
<p>By SOLOMON</p>
<p style="color:#fff;margin-top:20px;font-size:14px;">Swipe or tap to move<br>Collect coins, avoid trains!</p>
<button onclick="startGame()">PLAY NOW ▶️</button>
<p style="color:#aaa;margin-top:15px;font-size:12px;">Use ⬅️ ⬆️ ➡️ to control</p>
</div>
</div>

<script>
let lane=1, isJumping=false, coins=0, score=0, speed=4, gameRunning=false;
let obstacles=[], coinObjs=[], gameLoop, spawnLoop;
let player=document.getElementById('player');

function startGame(){
 document.getElementById('startScreen').style.display='none';
 gameRunning=true; lane=1; coins=0; score=0; speed=4;
 obstacles.forEach(o=>o.el.remove()); obstacles=[];
 coinObjs.forEach(c=>c.el.remove()); coinObjs=[];
 updatePlayerPos();
 gameLoop=setInterval(update,20);
 spawnLoop=setInterval(spawn,1200);
}

function updatePlayerPos(){
 const lanePos=[16.5,49.5,83]-1;
 let positions=[16.5,49.5,82.5];
 player.style.left=positions[lane]+'%';
}

function moveLeft(){ if(lane>0){ lane--; updatePlayerPos(); } }
function moveRight(){ if(lane<2){ lane++; updatePlayerPos(); } }
function jump(){
 if(isJumping) return;
 isJumping=true;
 player.style.bottom='160px';
 setTimeout(()=>{ player.style.bottom='80px'; isJumping=false; },500);
}

function spawn(){
 if(!gameRunning) return;
 if(Math.random()>0.3){
  let l=Math.floor(Math.random()*3);
  let el=document.createElement('div');
  el.className=Math.random()>0.5?'obstacle train':'obstacle';
  el.style.left=[5,38,71][l]+'%';
  el.style.bottom='100%';
  document.getElementById('game').appendChild(el);
  obstacles.push({el:el,lane:l,y:100});
 }
 if(Math.random()>0.2){
  let l=Math.floor(Math.random()*3);
  let el=document.createElement('div');
  el.className='coin';
  el.style.left=[12,45,78][l]+'%';
  el.style.bottom='100%';
  document.getElementById('game').appendChild(el);
  coinObjs.push({el:el,lane:l,y:100});
 }
}

function update(){
 if(!gameRunning) return;
 score+=0.1; speed+=0.002;
 document.getElementById('score').textContent=Math.floor(score);
 
 obstacles.forEach((o,i)=>{
  o.y-=speed;
  o.el.style.bottom=o.y+'%';
  if(o.y<15 && o.y>5 && o.lane==lane && !isJumping){
   gameOver();
  }
  if(o.y<-10){ o.el.remove(); obstacles.splice(i,1); }
 });
 
 coinObjs.forEach((c,i)=>{
  c.y-=speed;
  c.el.style.bottom=c.y+'%';
  if(c.y<18 && c.y>8 && c.lane==lane){
   coins++; document.getElementById('coins').textContent=coins;
   c.el.remove(); coinObjs.splice(i,1);
  }
  if(c.y<-10){ c.el.remove(); coinObjs.splice(i,1); }
 });
}

function gameOver(){
 gameRunning=false;
 clearInterval(gameLoop); clearInterval(spawnLoop);
 alert('💥 CRASHED!\n\nScore: '+Math.floor(score)+'m\nCoins: '+coins+'\n\nPlay Again?');
 document.getElementById('startScreen').style.display='flex';
 document.getElementById('startScreen').innerHTML=`<h1>💥 GAME OVER</h1><p>Score: ${Math.floor(score)}m | Coins: ${coins}</p><button onclick="startGame()">PLAY AGAIN ▶️</button>`;
}

// Swipe controls
let startX=0;
document.getElementById('game').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;});
document.getElementById('game').addEventListener('touchend',e=>{
 let endX=e.changedTouches[0].clientX;
 let diff=endX-startX;
 if(Math.abs(diff)>50){
  if(diff>0) moveRight(); else moveLeft();
 }else{
  jump();
 }
});
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowLeft') moveLeft();
 if(e.key=='ArrowRight') moveRight();
 if(e.key=='ArrowUp' || e.key==' ') jump();
});
</script>
</body>
</html>
