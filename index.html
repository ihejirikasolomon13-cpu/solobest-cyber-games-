
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solobest Cyber Games - Realistic Edition</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/808/808439.png">
<style>
body{margin:0;background:linear-gradient(#0a0e1a,#1a2340);color:white;font-family:Arial;text-align:center;overflow-x:hidden}
.header{padding:20px;background:rgba(0,255,136,0.1);border-bottom:2px solid #00ff88}
.ad-box{background:linear-gradient(45deg,yellow,gold);color:black;padding:18px;font-weight:900;font-size:19px;border:3px solid red;margin:12px;border-radius:15px;box-shadow:0 4px 15px rgba(255,255,0,0.5);animation:pulse 2s infinite}
.ad-box a{color:black;text-decoration:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.game-card{background:linear-gradient(135deg,#1a2340,#24335a);margin:15px;padding:20px;border-radius:20px;border:2px solid #00ff88;box-shadow:0 8px 20px rgba(0,255,136,0.2)}
.stats{display:flex;justify-content:space-around;margin:10px 0;font-size:18px}
button{background:linear-gradient(#00ff88,#00cc6a);color:black;padding:16px 35px;font-size:20px;font-weight:900;border:none;border-radius:12px;margin:10px;box-shadow:0 4px 10px rgba(0,255,136,0.4)}
canvas{background:linear-gradient(#87CEEB,#1e3a5f);display:none;margin:15px auto;border:3px solid #00ff88;border-radius:15px;max-width:95%}
.controls{margin-top:10px;font-size:14px;color:#aaa}
.badge{background:red;color:white;padding:3px 8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1 style="margin:0">🎮 SOLOBEST CYBER GAMES</h1>
<p style="margin:5px;color:#00ff88">Realistic APP Edition - By Solomon</p>
</div>
<div class="ad-box">
<a href="https://wa.me/2348134918051?text=Boss I want to advertise my business on Solobest Games. How much?">
🔥 ADVERTISE HERE - 10K/MONTH 🔥<br>
<span style="font-size:14px">📢 Reach 500+ Gamers - Tap to Advertise!</span>
</a>
</div>
<div class="game-card">
<h2>🏃 SUBWAY SURFER LAGOS <span class="badge">HOT 🔥</span></h2>
<div class="stats">
<span>🏆 High: <span id="high1">0</span></span>
<span>💰 Coins: <span id="coin1">0</span></span>
<span>🔥 Score: <span id="score1">0</span></span>
</div>
<button onclick="startRunner()">▶️ PLAY NOW</button>
<canvas id="game1" width="360" height="520"></canvas>
<div class="controls">👆 TAP TO JUMP | Double Jump | Collect 💰 Avoid 🚂</div>
</div>
<div class="game-card">
<h2>🔫 CYBER SHOOTER 2026 <span class="badge">NEW</span></h2>
<div class="stats">
<span>🏆 High: <span id="high2">0</span></span>
<span>💥 Kills: <span id="score2">0</span></span>
</div>
<button onclick="startShooter()">🔫 PLAY SHOOTER</button>
<canvas id="game2" width="360" height="520"></canvas>
</div>
<script>
let r={score:0,coins:0,y:380,jump:0,blocks:[],coinsArr:[],particles:[],game:false,high:localStorage.getItem('runnerHigh')||0,lane:1}
document.getElementById('high1').innerText=r.high;
function startRunner(){
let c=document.getElementById('game1'), ctx=c.getContext('2d'); c.style.display='block';
r.score=0; r.coins=0; r.blocks=[]; r.coinsArr=[]; r.particles=[]; r.game=true; r.y=380; r.jump=0;
let bgX=0;
c.onclick=()=>{if(r.y>=380){r.jump=-16; r.particles.push({x:90,y:400,vx:-2,vy:-2})}else if(r.jump>-2){r.jump=-14}}
function drawRunner(){
ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(80,r.y+42,20,6,0,0,Math.PI*2); ctx.fill();
ctx.fillStyle='#FFD700'; ctx.fillRect(65,r.y+10,30,20);
ctx.fillStyle='#00ff88'; ctx.fillRect(60,r.y+30,40,12);
ctx.fillStyle='#FFDBAC'; ctx.beginPath(); ctx.arc(80,r.y+10,12,0,Math.PI*2); ctx.fill();
ctx.fillStyle='black'; ctx.fillRect(76,r.y+8,3,3); ctx.fillRect(84,r.y+8,3,3);
ctx.fillStyle='#222'; ctx.fillRect(62,r.y+42,10,8); ctx.fillRect(88,r.y+42,10,8);
}
function loop(){
if(!r.game) return;
bgX-=4; if(bgX<-360) bgX=0;
ctx.clearRect(0,0,360,520);
ctx.fillStyle='#2a2a2a'; for(let i=0;i<3;i++){ctx.fillStyle='#444'; ctx.fillRect(i*120+bgX%120,0,4,520)}
ctx.fillStyle='#555'; ctx.fillRect(0,420,360,100);
for(let i=0;i<10;i++){ctx.fillStyle='#777'; ctx.fillRect((i*60+bgX*0.5)%360,430,30,3)}
r.y+=r.jump; r.jump+=0.9; if(r.y>380){r.y=380; r.jump=0}
if(Math.random()<0.025){r.blocks.push({x:380,y:380,w:50,h:40,type:Math.random()>0.5?'train':'barrier'})}
if(Math.random()<0.04){r.coinsArr.push({x:380,y:320+Math.random()*80,r:12,spin:0})}
for(let b of r.blocks){b.x-=6;
if(b.type=='train'){ctx.fillStyle='#E74C3C'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle='#C0392B'; ctx.fillRect(b.x+5,b.y+5,b.w-10,8); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(b.x+10,b.y+b.h,8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(b.x+b.w-10,b.y+b.h,8,0,Math.PI*2); ctx.fill()}else{ctx.fillStyle='#F39C12'; ctx.fillRect(b.x,b.y+20,b.w,20); ctx.fillStyle='black'; ctx.fillRect(b.x,b.y+25,b.w,5)}
if(b.x<95 && b.x+b.w>65 && r.y>340){r.game=false; if(r.score>r.high){localStorage.setItem('runnerHigh',r.score); r.high=r.score} alert('💥 CRASH! Score:'+r.score+' Coins:'+r.coins); document.getElementById('high1').innerText=r.high; return}
if(b.x<-60){r.blocks.shift(); r.score+=10}
}
for(let i=r.coinsArr.length-1;i>=0;i--){let co=r.coinsArr[i]; co.x-=6; co.spin+=0.2;
ctx.save(); ctx.translate(co.x,co.y); ctx.rotate(co.spin); ctx.fillStyle='gold'; ctx.beginPath(); ctx.arc(0,0,co.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFD700'; ctx.fillRect(-3,-8,6,16); ctx.restore();
if(Math.abs(co.x-80)<25 && Math.abs(co.y-(r.y+20))<30){r.coinsArr.splice(i,1); r.coins++; r.score+=5; r.particles.push({x:co.x,y:co.y,vx:Math.random()*4-2,vy:-3})}
if(co.x<-20) r.coinsArr.splice(i,1)
}
for(let i=r.particles.length-1;i>=0;i--){let p=r.particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; ctx.fillStyle='gold'; ctx.fillRect(p.x,p.y,4,4); if(p.y>500) r.particles.splice(i,1)}
drawRunner();
document.getElementById('score1').innerText=r.score; document.getElementById('coin1').innerText=r.coins;
requestAnimationFrame(loop);
}loop();
}
let s={score:0,x:180,bullets:[],enemies:[],game:false,high:localStorage.getItem('shooterHigh')||0}
document.getElementById('high2').innerText=s.high;
function startShooter(){
let c=document.getElementById('game2'), ctx=c.getContext('2d'); c.style.display='block'; s.score=0; s.bullets=[]; s.enemies=[]; s.game=true;
c.ontouchmove=(e)=>{s.x=e.touches[0].clientX - c.getBoundingClientRect().left}; c.onmousemove=(e)=>{s.x=e.clientX - c.getBoundingClientRect().left}; c.onclick=()=>{s.bullets.push({x:s.x,y:460})}
function loop2(){
if(!s.game) return; ctx.clearRect(0,0,360,520);
ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,360,520);
for(let i=0;i<30;i++){ctx.fillStyle='white'; ctx.fillRect(Math.random()*360,Math.random()*520,1,1)}
ctx.fillStyle='#00ff88'; ctx.fillRect(s.x-20,470,40,18); ctx.fillStyle='#00cc6a'; ctx.fillRect(s.x-5,450,10,20);
if(Math.random()<0.04){s.enemies.push({x:Math.random()*320+20,y:-20,hp:s.score>20?2:1})}
for(let b of s.bullets){b.y-=9; ctx.fillStyle='yellow'; ctx.shadowColor='yellow'; ctx.shadowBlur=10; ctx.fillRect(b.x, b.y,4,12); ctx.shadowBlur=0}
for(let e of s.enemies){e.y+=2+ s.score*0.02; let isBoss=e.hp>1;
ctx.fillStyle=isBoss?'#9B59B6':'#E74C3C'; ctx.beginPath(); ctx.arc(e.x,e.y,isBoss?18:12,0,Math.PI*2); ctx.fill();}
for(let i=s.bullets.length-1;i>=0;i--){for(let j=s.enemies.length-1;j>=0;j--){if(Math.abs(s.bullets[i].x-s.enemies[j].x)<20 && Math.abs(s.bullets[i].y-s.enemies[j].y)<20){s.enemies[j].hp--; s.bullets.splice(i,1); if(s.enemies[j].hp<=0){s.enemies.splice(j,1); s.score++;} break;}}}
s.bullets=s.bullets.filter(b=>b.y>-10); s.enemies=s.enemies.filter(e=>{if(e.y>500){s.game=false; if(s.score>s.high){localStorage.setItem('shooterHigh',s.score); s.high=s.score} alert('GAME OVER! Kills:'+s.score); document.getElementById('high2').innerText=s.high; return false} return true});
document.getElementById('score2').innerText=s.score;
requestAnimationFrame(loop2);
}loop2();
}
</script>
</body>
</html>
