
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWave</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{height:100dvh;background:#111b21;display:flex}
#sidebar{width:100%;max-width:420px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
#header{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;color:#e9edef}
.icon-btn{background:#202c33;border:none;color:#aebac1;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}
#search{padding:8px 12px}
#search input{width:100%;background:#202c33;border:none;border-radius:8px;padding:10px;color:#d1d7db}
.contacts{flex:1;overflow-y:auto}
.contact{display:flex;align-items:center;padding:12px 16px;gap:12px}
.contact.active,.contact:hover{background:#202c33}
.avatar{width:49px;height:49px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
.name{color:#e9edef}.last{color:#8696a0;font-size:13px}
#chatArea{flex:1;background:#0b141a;display:flex;flex-direction:column}
#chatHeader{background:#202c33;padding:10px 16px;display:flex;align-items:center;gap:12px;color:#e9edef}
#messages{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:70%;padding:8px 10px;border-radius:8px;margin:4px 0}
.msg.sent{background:#005c4b;color:#e9edef;margin-left:auto}
.msg.recv{background:#202c33;color:#e9edef;margin-right:auto}
#inputBar{background:#202c33;padding:8px 12px;display:flex;gap:8px}
#inputBar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px;color:white}
#sendBtn{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:white}
#login{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:10}
#loginBox{background:#202c33;padding:32px;border-radius:12px;width:90%;max-width:360px;text-align:center}
#loginBox h1{color:#e9edef}
#loginBox input{width:100%;padding:12px;border-radius:8px;border:none;background:#2a3942;color:white;margin:12px 0}
#loginBox button{width:100%;padding:12px;background:#00a884;border:none;border-radius:8px;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="login"><div id="loginBox"><h1>ChatWave</h1><input id="userNameInput" placeholder="Your name"><button onclick="login()">Start Chatting</button></div></div>
<div id="sidebar"><div id="header"><h2>Chats</h2><button class="icon-btn" onclick="newChat()">+</button></div><div id="search"><input id="searchInput" placeholder="Search"></div><div class="contacts" id="contactsList"></div></div>
<div id="chatArea"><div id="chatHeader"><div class="avatar" id="chatAvatar">S</div><div style="flex:1"><div id="chatName">Select Chat</div></div></div><div id="messages"></div><div id="inputBar"><input id="msgInput" placeholder="Type a message"><button id="sendBtn" onclick="send()">></button></div></div>
<script>
let me=localStorage.getItem('chatwave_user')||'';let chats=JSON.parse(localStorage.getItem('chatwave_chats')||'{}');let current=null;
const defaults=[{name:'Solo Squad',avatar:'S',last:'Welcome!',msgs:[{t:'Welcome!',me:false,time:Date.now()}]}];
function init(){if(me)document.getElementById('login').style.display='none';renderContacts();document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});}
function login(){let n=document.getElementById('userNameInput').value.trim();if(!n)return alert('Enter name');me=n;localStorage.setItem('chatwave_user',n);document.getElementById('login').style.display='none';}
function save(){localStorage.setItem('chatwave_chats',JSON.stringify(chats))}
function renderContacts(){let list=document.getElementById('contactsList');list.innerHTML='';let keys=Object.keys(chats);if(keys.length===0){defaults.forEach(d=>{chats[d.name]=d});save();keys=Object.keys(chats)}keys.forEach(k=>{let c=chats[k];let div=document.createElement('div');div.className='contact'+(current===k?' active':'');div.innerHTML='<div class="avatar">'+(c.avatar||k[0])+'</div><div><div class="name">'+k+'</div><div class="last">'+(c.last||'')+'</div></div>';div.onclick=()=>openChat(k);list.appendChild(div);});}
function openChat(name){current=name;document.getElementById('chatName').innerText=name;document.getElementById('chatAvatar').innerText=chats[name].avatar||name[0];renderMessages();}
function renderMessages(){let box=document.getElementById('messages');box.innerHTML='';if(!current)return;let msgs=chats[current].msgs||[];msgs.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.me?'sent':'recv');d.innerHTML=m.t+'<div style="font-size:10px;color:#8696a0;text-align:right">'+new Date(m.time).toLocaleTimeString()+'</div>';box.appendChild(d);});box.scrollTop=box.scrollHeight;}
function send(){let input=document.getElementById('msgInput');let txt=input.value.trim();if(!txt||!current)return;chats[current].msgs.push({t:txt,me:true,time:Date.now()});chats[current].last='You: '+txt;save();input.value='';renderMessages();setTimeout(()=>{let r=['Nice!','Got it!','Okay boss!','🔥'][Math.floor(Math.random()*4)];chats[current].msgs.push({t:r,me:false,time:Date.now()});chats[current].last=r;save();renderMessages();},800);}
function newChat(){let n=prompt('Name:');if(!n)return;if(!chats[n])chats[n]={name:n,avatar:n[0].toUpperCase(),last:'New chat',msgs:[]};save();renderContacts();openChat(n);}
init();
</script>
</body>
</html>
