
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWave</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{height:100dvh;background:#111b21;display:flex}#sidebar{width:100%;max-width:420px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}#header{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;color:#e9edef}#header h2{font-size:19px}.icon-btn{background:#202c33;border:none;color:#aebac1;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}#search{padding:8px 12px}#search input{width:100%;background:#202c33;border:none;border-radius:8px;padding:10px;color:#d1d7db;outline:none}.contacts{flex:1;overflow-y:auto}.contact{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:12px}.contact:hover,.contact.active{background:#202c33}.avatar{width:49px;height:49px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:20px}.contact-info{flex:1}.contact-info .name{color:#e9edef;font-size:17px}.contact-info .last{color:#8696a0;font-size:13px;margin-top:3px}.time{color:#8696a0;font-size:12px}#chatArea{flex:1;background:#0b141a;display:flex;flex-direction:column}#chatHeader{background:#202c33;padding:10px 16px;display:flex;align-items:center;gap:12px;color:#e9edef}#messages{flex:1;overflow-y:auto;padding:16px 8%;background:#0b141a}.msg{max-width:65%;padding:7px 10px;border-radius:8px;margin:4px 0;font-size:14.5px}.msg.sent{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0}.msg.recv{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0}.msg .meta{font-size:11px;color:#8696a0;text-align:right;margin-top:4px}#inputBar{background:#202c33;padding:8px 12px;display:flex;gap:8px}#inputBar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px 16px;color:white;outline:none}#sendBtn{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:white;font-size:20px;cursor:pointer}#login{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:10}#loginBox{background:#202c33;padding:32px;border-radius:12px;width:90%;max-width:360px;text-align:center}#loginBox h1{color:#e9edef;margin-bottom:16px}#loginBox input{width:100%;padding:12px;border-radius:8px;border:none;background:#2a3942;color:white;margin:12px 0}#loginBox button{width:100%;padding:12px;background:#00a884;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer}.emoji-bar{display:flex;gap:6px;padding:6px 12px;background:#202c33;overflow-x:auto}.emoji-bar span{cursor:pointer;font-size:20px;padding:4px}@media(max-width:768px){#sidebar.hidden{display:none}#chatArea.hidden{display:none}#chatHeader .back{display:block} }#chatHeader .back{display:none}
</style>
</head>
<body>
<div id="login"><div id="loginBox"><h1>💬 ChatWave</h1><p style="color:#8696a0">Enter your name</p><input id="userNameInput" placeholder="Your name e.g Solo"><button onclick="login()">Start Chatting</button></div></div>
<div id="sidebar"><div id="header"><h2>Chats</h2><button class="icon-btn" onclick="newChat()">＋</button></div><div id="search"><input id="searchInput" placeholder="Search" oninput="filterChats()"></div><div class="contacts" id="contactsList"></div></div>
<div id="chatArea" class="hidden"><div id="chatHeader"><button class="icon-btn back" onclick="showSidebar()">‹</button><div class="avatar" id="chatAvatar">S</div><div style="flex:1"><div style="font-weight:600" id="chatName">Select Chat</div><div style="font-size:13px;color:#8696a0" id="chatStatus">tap a chat</div></div><button class="icon-btn" onclick="clearChat()">🗑</button></div><div id="messages"></div><div class="emoji-bar"><span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🎉')">🎉</span></div><div id="inputBar"><input id="msgInput" placeholder="Type a message" onkeypress="if(event.key==='Enter')send()"><button id="sendBtn" onclick="send()">➤</button></div></div>
<script>
let me=localStorage.getItem('chatwave_user')||'';let chats=JSON.parse(localStorage.getItem('chatwave_chats')||'{}');let current=null;
const defaults=[{name:'Solo Squad 🔥',last:'Welcome!',avatar:'S',msgs:[{t:'Welcome to ChatWave! Tap + to create new chat 💬',me:false,time:Date.now()}]},{name:'Business Team',last:'Meeting 10am',avatar:'B',msgs:[]},{name:'Family ❤️',last:'Hi',avatar:'F',msgs:[]}];
function init(){if(me)document.getElementById('login').style.display='none';renderContacts()}function login(){let n=document.getElementById('userNameInput').value.trim();if(!n)return alert('Enter name');me=n;localStorage.setItem('chatwave_user',n);document.getElementById('login').style.display='none'}function save(){localStorage.setItem('chatwave_chats',JSON.stringify(chats))}function renderContacts(){let list=document.getElementById('contactsList');list.innerHTML='';let keys=Object.keys(chats);if(keys.length===0){defaults.forEach(d=>{chats[d.name]=d});save();keys=Object.keys(chats)}let filter=(document.getElementById('searchInput').value||'').toLowerCase();keys.filter(k=>k.toLowerCase().includes(filter)).forEach(k=>{let c=chats[k];let div=document.createElement('div');div.className='contact'+(current===k?' active':'');div.innerHTML=`<div class="avatar">${c.avatar||k[0]}</div><div class="contact-info"><div class="name">${k}</div><div class="last">${c.last||''}</div></div><div class="time">${c.msgs&&c.msgs.length?new Date(c.msgs[c.msgs.length-1].time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</div>`;div.onclick=()=>openChat(k);list.appendChild(div)})}function openChat(name){current=name;document.getElementById('sidebar').classList.add('hidden');document.getElementById('chatArea').classList.remove('hidden');document.getElementById('chatName').innerText=name;document.getElementById('chatAvatar').innerText=chats[name].avatar||name[0];document.getElementById('chatStatus').innerText='online';renderMessages()}function showSidebar(){document.getElementById('sidebar').classList.remove('hidden');document.getElementById('chatArea').classList.add('hidden')}function renderMessages(){let box=document.getElementById('messages');box.innerHTML='';if(!current)return;let msgs=chats[current].msgs||[];msgs.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.me?'sent':'recv');d.innerHTML=`${m.t}<div class="meta">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${m.me?'✓✓':''}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight;renderContacts()}function send(){let input=document.getElementById('msgInput');let txt=input.value.trim();if(!txt||!current)return;let msg={t:txt,me:true,time:Date.now()};chats[current].msgs.push(msg);chats[current].last='You: '+txt;save();input.value='';renderMessages();setTimeout(()=>{let replies=["Nice! 🔥","Got it!","Lol 😂","Okay boss!","On it!","Cool!","See you!","👍"];let r=replies[Math.floor(Math.random()*replies.length)];chats[current].msgs.push({t:r,me:false,time:Date.now()});chats[current].last=r;save();renderMessages()},900)}function addEmoji(e){document.getElementById('msgInput').value+=e}function newChat(){let n=prompt('Name for new chat:');if(!n)return;if(!chats[n])chats[n]={name:n,last:'New chat',avatar:n[0].toUpperCase(),msgs:[]};save();renderContacts();openChat(n)}function filterChats(){renderContacts()}function clearChat(){if(!current)return;if(confirm('Clear messages?')){chats[current].msgs=[];save();renderMessages()}}init();
</script>
</body>
</html>
